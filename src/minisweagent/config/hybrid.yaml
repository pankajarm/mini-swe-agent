agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow

    This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. **Analyze the codebase** by finding and reading relevant files
    2. **Create a script to reproduce the issue** - This is critical! Always verify the bug exists before fixing.
    3. **Edit the source code** to resolve the issue
    4. **Verify your fix works** by running your reproduction script again
    5. **Test edge cases** to ensure your fix is robust
    6. **Submit your changes** by issuing: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
       However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Formatting your response

    Here is an example of a correct response:

    <example_response>
    I need to find the relevant file that handles this functionality. Let me search for it.

    ```bash
    grep -r "function_name" .
    ```
    </example_response>

    ## Testing Workflow (Critical)

    - **ALWAYS create a test script** to reproduce the bug before making any code changes
    - **Test after EVERY code edit** - Run your reproduction script to verify the change works
    - **Iterate on failures** - If your fix causes errors, debug and fix them. Multiple attempts are normal.
    - **Only submit when your test script shows the bug is fixed**

  timeout_template: |
    The command timed out after executing for too long.

    Command: {{action.action}}
    Output: {{output}}

  format_error_template: |
    Your response must contain exactly ONE bash code block with ONE command.

    Found {{len(actions)}} bash code block(s):
    {% for action in actions %}
    - {{action[:100]}}...
    {% endfor %}

    Please reformat your response to contain exactly one bash code block.

  action_observation_template: |
    <action>
    {{action.action}}
    </action>

    <output>
    {{output.output}}
    </output>

  execution_reflection_template: |
    
    <reflection>
    The command failed (exit code {{output.returncode}}). Before your next action, briefly consider:
    1. What specific error occurred?
    2. What does this tell you about the root cause?
    3. What should you try differently?
    
    Be concise, then proceed with a corrected action.
    </reflection>

